# ===================================================================
# Antigravity Trade — Common Platform Configuration
# ===================================================================
spring.application.name=crypto-trading-simulator
server.port=8080

# Active Profile: "dev" uses H2 in-memory DB. Switch to "prod" for MySQL.
spring.profiles.active=dev

# ===================================================================
# Application Settings
# ===================================================================
app.starting-balance=1000000.00000000

# JWT — CHANGE THIS to a random 64-char hex string before deploying!
app.jwt-secret=CHANGE_ME_TO_A_SECURE_RANDOM_SECRET
app.jwt-expiration-ms=86400000
app.jwt-refresh-expiration-ms=604800000

# Default Crypto Trading Pairs (comma-separated, uppercase)
app.trading-pairs=BTCUSDT,ETHUSDT,SOLUSDT,ADAUSDT,BNBUSDT

# ===================================================================
# Email OTP — Brevo (Sendinblue) SMTP
# ─────────────────────────────────────────────────────────────────
#  FREE TIER : 300 emails/day  |  9,000 emails/month  — FOREVER FREE
#  COST      : ₹0 — No credit card needed
#  LIMIT     : 300/day (plenty for OTP use)
#  SIGN UP   : https://app.brevo.com/account/register
#
#  HOW TO GET SMTP KEY:
#   1. Sign up at brevo.com (free, no card)
#   2. Go to: Account → SMTP & API → SMTP tab
#   3. Click "Generate a new SMTP key"
#   4. Copy the key below as spring.mail.password
#   5. Set app.mail.from to your verified Brevo sender email
# ===================================================================
app.mail.enabled=true
app.mail.from=noreply@antigravitytrade.com

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
# IMPORTANT: set this to YOUR Brevo login email (the email you registered with at brevo.com)
spring.mail.username=your-brevo-login-email@gmail.com
spring.mail.password=CHANGE_ME_TO_YOUR_SMTP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================================================================
# Firebase Admin SDK
# ─────────────────────────────────────────────────────────────────
#  FREE TIER : Spark Plan — FOREVER FREE, NO credit card needed
#  INCLUDES  : Unlimited Email/Password Auth, 10K phone SMS/month
#  SIGN UP   : https://console.firebase.google.com
#
#  HOW TO GET SERVICE ACCOUNT KEY:
#   1. Firebase Console → Project Settings → Service Accounts tab
#   2. Click "Generate new private key" → download JSON
#   3. Rename it firebase-config.json
#   4. Place it in: backend/firebase-config.json
#
#  If this file is missing the app still works — email OTP continues
#  to function normally. Firebase endpoints return 503.
# ===================================================================
firebase.config.path=firebase-config.json

# ===================================================================
# SMS OTP — Fast2SMS (India)
# ─────────────────────────────────────────────────────────────────
#  FREE TIER : ₹50 free credits on signup (~200–400 free OTPs)
#  COST      : ₹0.12–₹0.25 per SMS after free credits
#  NO CARD   : No credit card required to sign up or get API key
#  LIMIT     : No daily cap on paid credits
#  SIGN UP   : https://fast2sms.com
#
#  HOW TO GET API KEY:
#   1. Sign up at fast2sms.com (free)
#   2. Go to: Dashboard → Dev API → API Credentials
#   3. Copy the API Key below
#   4. Set sms.enabled=true to activate real SMS delivery
#
#  When sms.enabled=false (default dev mode), OTP is printed to
#  the server console — no SMS is sent.
# ===================================================================
sms.enabled=false
fast2sms.api-key=YOUR_FAST2SMS_API_KEY

# ===================================================================
# MongoDB Atlas — Real-Time Price Data & Trade History
# ─────────────────────────────────────────────────────────────────
#  FREE TIER : M0 Shared Cluster — FOREVER FREE, NO credit card
#  STORAGE   : 512 MB
#  LIMIT     : 100 connections, shared cluster
#  SIGN UP   : https://cloud.mongodb.com
#
#  HOW TO GET URI:
#   1. Sign up at cloud.mongodb.com (free)
#   2. Create an M0 cluster (free tier)
#   3. Database Access → Add user (username/password)
#   4. Network Access → Allow from anywhere (0.0.0.0/0) for dev
#   5. Cluster → Connect → Drivers → Copy URI
#   6. Replace <username> and <password> in the URI below
# ===================================================================
# Local MongoDB (dev):
spring.data.mongodb.uri=mongodb://localhost:27017/crypto_trading

# MongoDB Atlas (production — uncomment and fill in):
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@cluster0.xxxxx.mongodb.net/crypto_trading?retryWrites=true&w=majority

# ===================================================================
# Redis — OTP Cache & Rate Limiting
# ─────────────────────────────────────────────────────────────────
#  Dev profile: Redis is DISABLED (in-memory cache used instead).
#               See application-dev.properties.
#
#  Production — use Upstash Redis (FREE forever):
#   FREE TIER : 10,000 commands/day | 256 MB storage | NO credit card
#   SIGN UP   : https://upstash.com
#   HOW TO GET: Upstash Console → Create Database → REST tab → Copy URL
#
#  Uncomment for production:
# spring.data.redis.url=rediss://:YOUR_UPSTASH_REDIS_PASSWORD@YOUR_ENDPOINT.upstash.io:6380
# ===================================================================

