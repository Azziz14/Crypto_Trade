# ===================================================================
# Dev Profile: In-Memory H2 & In-Memory Cache (Default)
# ===================================================================

# H2 Database Config
spring.datasource.url=jdbc:h2:file:./data/cryptodb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Resilient Dev Auto-Config: Exclude Redis Auto-Configuration to allow out-of-the-box local execution
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# JPA Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cache Config (Using ConcurrentHashMap provider)
spring.cache.type=simple
